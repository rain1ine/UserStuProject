<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>注册 - 学校管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-logo">&#127979;</div>
  <div class="auth-title">学校管理系统</div>
  <div class="auth-sub">创建新账号</div>

  <div class="card" style="padding:20px;">
    <!-- 角色选择 -->
    <div class="seg" id="role-seg">
      <button type="button" class="seg-item active" data-role="学生">学生</button>
      <button type="button" class="seg-item" data-role="管理员">管理员</button>
    </div>

    <div class="form-group">
      <label for="username">用户名 <span class="required">*</span></label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="nickname">昵称</label>
      <input type="text" id="nickname" placeholder="请输入昵称（选填）">
    </div>
    <div class="form-group">
      <label for="password">密码 <span class="required">*</span></label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="password2">确认密码 <span class="required">*</span></label>
      <input type="password" id="password2" placeholder="请再次输入密码" autocomplete="new-password">
      <div class="field-error" id="pwd-error">两次密码不一致</div>
    </div>

    <!-- 学生信息（角色为学生时显示） -->
    <div id="student-fields">
      <div class="section-title" style="margin-top:4px;"><span class="bar"></span> 学生信息</div>
      <div class="form-group">
        <label for="s-name">真实姓名 <span class="required">*</span></label>
        <input type="text" id="s-name" placeholder="请输入真实姓名">
      </div>
      <div class="form-group">
        <label for="s-gender">性别 <span class="required">*</span></label>
        <select id="s-gender">
          <option value="">请选择性别</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="form-group">
        <label for="s-age">年龄 <span class="required">*</span></label>
        <input type="number" id="s-age" placeholder="请输入年龄" min="1" max="150">
      </div>
      <div class="form-group">
        <label for="s-phone">手机号</label>
        <input type="tel" id="s-phone" placeholder="请输入手机号" maxlength="11">
      </div>
      <div class="form-group">
        <label for="s-birthday">出生日期</label>
        <input type="date" id="s-birthday">
      </div>
    </div>

    <button class="btn btn-primary" id="btn-register">注 册</button>
  </div>

  <p class="auth-switch">已有账号？<a href="login.html">立即登录</a></p>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  var currentRole = '学生';
  var segItems = document.querySelectorAll('#role-seg .seg-item');

  function applyRole() {
    var isStudent = (currentRole === '学生');
    document.getElementById('student-fields').style.display = isStudent ? '' : 'none';
  }

  segItems.forEach(function (el) {
    el.addEventListener('click', function () {
      segItems.forEach(function (x) { x.classList.remove('active'); });
      this.classList.add('active');
      currentRole = this.getAttribute('data-role');
      applyRole();
    });
  });

  var btn = document.getElementById('btn-register');
  var pwdError = document.getElementById('pwd-error');
  var pwd2El = document.getElementById('password2');

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  btn.addEventListener('click', function () {
    var username = document.getElementById('username').value.trim();
    var nickname = document.getElementById('nickname').value.trim();
    var password = document.getElementById('password').value;
    var password2 = pwd2El.value;

    if (!username) { showToast('请输入用户名', 'warning'); return; }
    if (username.length < 3) { showToast('用户名至少 3 个字符', 'warning'); return; }
    if (!password) { showToast('请输入密码', 'warning'); return; }
    if (password.length < 6) { showToast('密码至少 6 位', 'warning'); return; }
    if (password !== password2) {
      pwdError.classList.add('show');
      pwd2El.classList.add('error');
      return;
    }
    pwdError.classList.remove('show');
    pwd2El.classList.remove('error');

    var data = {
      username: username,
      password: password,
      nickname: nickname || username,
      role: currentRole
    };

    if (currentRole === '学生') {
      var name = document.getElementById('s-name').value.trim();
      var gender = document.getElementById('s-gender').value;
      var age = parseInt(document.getElementById('s-age').value, 10);
      var phone = document.getElementById('s-phone').value.trim();
      var birthday = document.getElementById('s-birthday').value || null;

      if (!name) { showToast('请输入真实姓名', 'warning'); return; }
      if (!gender) { showToast('请选择性别', 'warning'); return; }
      if (isNaN(age) || age < 1 || age > 150) { showToast('请输入有效年龄 (1-150)', 'warning'); return; }
      if (phone && !/^1\d{10}$/.test(phone)) { showToast('请输入有效的 11 位手机号', 'warning'); return; }

      data.name = name;
      data.gender = gender;
      data.age = age;
      data.phone_number = phone || null;
      data.birthday = birthday;
    }

    btn.disabled = true;
    btn.textContent = '注册中...';
    toggleLoading(true, '注册中...');

    apiRegister(data)
      .then(function () {
        showToast('注册成功，请登录', 'success');
        setTimeout(function () { window.location.href = 'login.html'; }, 800);
      })
      .catch(function (err) {
        showToast(err.message || '注册失败', 'error');
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = '注 册';
        toggleLoading(false);
      });
  });

  // 实时清除密码不一致提示
  pwd2El.addEventListener('input', function () {
    pwdError.classList.remove('show');
    this.classList.remove('error');
  });

  applyRole();
})();
</script>

</body>
</html>
