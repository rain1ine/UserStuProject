<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>课程信息 - 学校管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <button class="btn-back" onclick="window.location.href='course_list.html'">&#8592;</button>
  <span class="brand" onclick="window.location.href='index.html'"><span class="logo-dot">&#127979;</span> <span id="page-title">新增课程</span></span>
  <div class="nav-right">
    <button class="btn-logout" onclick="logout()">退出</button>
  </div>
</nav>

<div class="page">
  <div class="card">
    <div class="card-header" id="form-title">新增课程</div>

    <form id="course-form" autocomplete="off">
      <div class="form-group">
        <label for="name">课程名称 <span class="required">*</span></label>
        <input type="text" id="name" placeholder="如：语文 / 数学 / 化学..." maxlength="100">
        <div class="field-error" id="name-error">请输入课程名称</div>
      </div>
      <div class="form-group">
        <label for="credit">学分 <span class="required">*</span></label>
        <input type="number" id="credit" placeholder="请输入学分" min="1" max="20">
        <div class="field-error" id="credit-error">请输入有效学分 (1-20)</div>
      </div>
      <div class="form-group">
        <label for="teacher">任课老师</label>
        <select id="teacher">
          <option value="">请选择老师（可选）</option>
        </select>
      </div>

      <div class="btn-group" style="margin-top:6px;">
        <button type="button" class="btn btn-ghost" onclick="window.location.href='course_list.html'">取 消</button>
        <button type="submit" class="btn btn-primary" id="btn-submit">提 交</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
  var user = checkAuth();

  var params = new URLSearchParams(window.location.search);
  var mode = params.get('mode') || 'add';
  var idParam = params.get('id');
  var editId = (idParam !== null && idParam !== '') ? parseInt(idParam, 10) : null;
  var isEdit = (mode === 'edit' && editId !== null && !isNaN(editId));

  var teacherSelect = document.getElementById('teacher');
  apiGetAllTeachers()
    .then(function (res) {
      (res.data || []).forEach(function (t) {
        var opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name + '（' + (t.subject || '--') + '）';
        teacherSelect.appendChild(opt);
      });
      loadFormData();
    })
    .catch(function () { loadFormData(); });

  function loadFormData() {
    if (!isEdit) {
      document.getElementById('page-title').textContent = '新增课程';
      document.getElementById('form-title').textContent = '新增课程';
      return;
    }
    document.getElementById('page-title').textContent = '编辑课程';
    document.getElementById('form-title').textContent = '编辑课程 #' + editId;

    var cached = null;
    try {
      var raw = sessionStorage.getItem('edit_course');
      if (raw) {
        cached = JSON.parse(raw);
        sessionStorage.removeItem('edit_course');
        if (cached.id !== editId) cached = null;
      }
    } catch (e) { cached = null; }

    if (cached) {
      fillForm(cached);
    } else {
      toggleLoading(true, '加载课程信息...');
      apiSearchCourse({ course_id: editId })
        .then(function (res) {
          var rows = (res && res.data) || [];
          var found = null;
          for (var i = 0; i < rows.length; i++) if (rows[i].id === editId) { found = rows[i]; break; }
          if (found) fillForm(found);
          else showToast('未找到该课程信息', 'error');
        })
        .catch(function (err) { showToast('加载失败: ' + (err.message || ''), 'error'); })
        .finally(function () { toggleLoading(false); });
    }
  }

  function fillForm(d) {
    document.getElementById('name').value = d.name || '';
    document.getElementById('credit').value = d.credit || '';
    teacherSelect.value = d.teacher_id || '';
  }

  function validate() {
    var valid = true;
    var name = document.getElementById('name').value.trim();
    var credit = parseInt(document.getElementById('credit').value, 10);
    function setErr(id, elId, show) {
      document.getElementById(id).classList.toggle('show', show);
      document.getElementById(elId).classList.toggle('error', show);
    }
    if (!name) { setErr('name-error', 'name', true); valid = false; } else setErr('name-error', 'name', false);
    if (isNaN(credit) || credit < 1 || credit > 20) { setErr('credit-error', 'credit', true); valid = false; } else setErr('credit-error', 'credit', false);
    return valid;
  }

  document.getElementById('course-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validate()) return;

    var name = document.getElementById('name').value.trim();
    var credit = parseInt(document.getElementById('credit').value, 10);
    var teacherId = teacherSelect.value;

    var btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = '提交中...';
    toggleLoading(true, '保存中...');

    var promise;
    if (isEdit) {
      promise = apiUpdateCourse(editId, {
        name: name,
        credit: credit,
        teacher_id: teacherId ? parseInt(teacherId, 10) : null
      });
    } else {
      promise = apiAddCourse({ name: name, credit: credit }, teacherId ? parseInt(teacherId, 10) : null);
    }

    promise
      .then(function () {
        showToast(isEdit ? '修改成功' : '新增成功', 'success');
        setTimeout(function () { window.location.href = 'course_list.html'; }, 600);
      })
      .catch(function (err) { showToast(err.message || '操作失败', 'error'); })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = '提 交';
        toggleLoading(false);
      });
  });
})();
</script>

</body>
</html>
